[project]
name = "echo-api"
version = "0.0.291"
description = "ECHO education agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "anyio>=4.8.0,<5.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "httpx>=0.28.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "tzdata>=2025.2",
    "email-validator>=2.2.0,<3.0.0",
    "SQLAlchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "alibabacloud-dypnsapi20170525>=2.0.0,<3.0.0",
    "alibabacloud-tea-openapi>=0.4.6,<1.0.0",
    "alibabacloud-tea-util>=0.3.15,<1.0.0",
    "av>=18.1.0,<19.0.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.0,<2.0.0",
]
dev = [
    "aiosqlite>=0.20.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "reportlab>=4.4.0,<5.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["../..", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
